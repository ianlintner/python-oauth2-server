# Conformance claim for this implementation, read by the language-neutral
# `oauth2-conformance` runner contract
# (https://github.com/ianlintner/oauth2-conformance).
#
# Pinned contract commit: b968cb19a2194268b819effae8b060b1e62d99df
# (contract v0.7 modern-server: +6 promoted-to-stable core scenarios (PR #21),
# generated STATUS dashboard (PR #20), modern-server gap catalog (PR #22), runner
# duplicate-form-key/header-matcher/step-repetition capabilities (PR #23); also
# pinned as CONFORMANCE_REF in the `conformance` job of .github/workflows/ci.yml;
# the manifest schema has no field for a commit, so the two are kept in sync by
# hand).
#
# Every profile listed under `profiles` MUST pass in the `conformance` CI job.
#
# extended-grants: only the seven `stable` device scenarios are claimed. The 43
# `draft` extended-grants scenarios (PAR, registration, JAR, RAR, exchange,
# assertions) and the remaining device drafts (expired-token,
# slow-down-on-fast-polling, repeated-param-rejected, unknown-client) are NOT
# claimed; they are deferred in the runner and are follow-up cards. Claiming the
# profile is required to run it; the gate below still enforces that no stable
# scenario fails.
#
# sender-constrained: only the seven `stable` DPoP scenarios are claimed and run
# (htm-binding, htu-binding, iat-stale, jti-replay, jti-required, token-type-dpop,
# typ-header). The 28 `draft` DPoP/mTLS/abuse scenarios are not gated and are
# follow-up cards (some already pass here, the rest are deferred by the runner).
#
# Deviations: none. The six token-lifecycle scenarios and the device access-denied
# scenario the contract records as `reference-deviation` (RFC wins over the Rust
# reference) are RFC-correct in this port, so there is nothing to declare. Two
# owner-gated requirements remain deferred in the contract for all ports and are
# known gaps, not deviations: RFC7662-4-expiry-checked and
# RFC9700-2.2.2-public-refresh-rotated-or-bound.
#
# core (contract PR #21): the six scenarios promoted from reference-deviation to
# stable — error-redirect-iss, response-type-unsupported, PKCE
# plain-method-rejected/missing-challenge/method-without-challenge and
# basic-auth-success — all pass against this port, so nothing to declare. The two
# scenarios the contract still records as reference-deviation
# (response-type-missing — this port answers unsupported_response_type instead of
# invalid_request on the redirect — and dual-auth-rejected — this port accepts
# credentials from both the Basic header and the body) are held back by the
# contract itself, not by this manifest: a failing non-stable scenario is
# reported as `deferred` by the runner and never gates here.
implementation: python-oauth2-server
contract: b968cb19a2194268b819effae8b060b1e62d99df
profiles: [core, token-lifecycle, oidc-basic, extended-grants, sender-constrained]
endpoint: http://localhost:8080
deviations: []
