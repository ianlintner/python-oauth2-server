name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --locked
      - name: Gate (ruff + pytest)
        run: bash scripts/gate.sh

  # Minimum-supported-dependency compat job. Resolves every *direct* dependency
  # to its declared floor (`--resolution lowest-direct`) so we actually exercise
  # the `>=` minimums in pyproject (e.g. fastapi>=0.142.2, pydantic-settings>=2.7.0)
  # rather than only the locked versions. Guards against regressions that would
  # silently declare support for a floor the source cannot import/run against.
  # `--resolution lowest-direct` must sit on `uv sync` (NOT `uv lock` followed by
  # a plain `uv sync`, which re-resolves back up to the latest versions). The
  # version assertion then fails loudly if the resolved pins drift from the
  # declared floors, proving the floors are genuinely exercised rather than only
  # the locked versions.
  min-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Sync dependencies at declared minimums
        run: uv sync --resolution lowest-direct
      - name: Assert floors are actually resolved
        # `--no-sync` so uv run reuses the floor env instead of re-resolving to
        # the locked (latest) versions on account of the resolution-mode change.
        run: |
          uv run --no-sync python - <<'PY'
          import fastapi, pydantic_settings
          assert fastapi.__version__ == "0.142.2", f"fastapi resolved to {fastapi.__version__}, floor is 0.142.2"
          assert pydantic_settings.__version__ == "2.7.0", f"pydantic-settings resolved to {pydantic_settings.__version__}, floor is 2.7.0"
          print("floors OK: fastapi", fastapi.__version__, "pydantic-settings", pydantic_settings.__version__)
          PY
      - name: Pytest at minimum versions
        run: uv run --no-sync pytest -q

  # MongoDB backend contract suite (Phase 3d) — deliberately NOT a `needs`:
  # of `gate` above (runs in parallel) and NOT folded into `scripts/gate.sh`,
  # so the default SQLite gate stays fast and never requires Docker. Docker
  # is available on ubuntu-latest GitHub-hosted runners, so the
  # `testcontainers` python package (already a dev dependency) can start its
  # own mongod — no `services:` container needed, keeping the local-dev and
  # CI code paths for the Mongo suite identical (same
  # `RUN_TESTCONTAINERS=1 uv run pytest ...` invocation either way).
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Sync dependencies (incl. mongo extra)
        run: uv sync --locked --all-extras
      - name: MongoStorage contract + e2e + compliance pin (testcontainers)
        env:
          RUN_TESTCONTAINERS: "1"
        run: >-
          uv run pytest tests/test_mongo_storage.py tests/test_mongo_admin.py
          tests/test_mongo_e2e.py tests/test_rfc_compliance.py -q

  # Conformance contract (v0.1 core + v0.2 token-lifecycle) — black-box run
  # of the published `oauth2-conformance` runner against this server in
  # conformance test mode. Deliberately NOT a `needs:` of `gate` above (runs
  # in parallel) and NOT folded into `scripts/gate.sh`, so the fast unit-test
  # gate stays independent of Node/pnpm and the contract checkout. The
  # contract repo is pinned by SHA (not a mutable branch) so a future runner
  # release can't silently change what "conformance" means under this PR.
  conformance:
    runs-on: ubuntu-latest
    env:
      # The contract's example seed advertises http://localhost:8080; driving
      # the runner on the host loopback leaves 8080 free on the runner VM.
      CONFORMANCE_REF: 604c62d6c98d8685ef2a1296d12014615dc38390
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check out the pinned contract repository
        uses: actions/checkout@v7
        with:
          repository: ianlintner/oauth2-conformance
          ref: ${{ env.CONFORMANCE_REF }}
          path: oauth2-conformance
      - name: Install the contract runner
        run: pnpm install --frozen-lockfile
        working-directory: oauth2-conformance/runner
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run the conformance runner against every claimed profile
        run: |
          set -euo pipefail
          CONTRACT="$GITHUB_WORKSPACE/oauth2-conformance"
          OAUTH2_CONFORMANCE_MODE=1 \
          OAUTH2_CONFORMANCE_SEED="$CONTRACT/examples/seed.yaml" \
          OAUTH2_ENV=test \
          OAUTH2_JWT_SECRET=conformance-ci-secret-0123456789abcdef \
          uv run python -m oauth2_server > sut.log 2>&1 &
          SUT=$!
          trap 'kill $SUT 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ready >/dev/null 2>&1; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" != 1 ]; then
            echo "SUT did not become ready; log follows" >&2
            cat sut.log >&2
            exit 1
          fi
          curl -fsS http://localhost:8080/ready
          echo
          # The runner is all-or-nothing, so its exit status is ignored here;
          # `check_conformance_report.py` is the actual gate (see that script
          # and `conformance.yaml` for the declared deviations). Every profile
          # claimed in conformance.yaml must pass; each is run separately and
          # gated against its own report.
          profiles="$(uv run python -c 'import yaml,sys; print(*yaml.safe_load(open("conformance.yaml"))["profiles"])')"
          contract="$(uv run python -c 'import yaml; print(yaml.safe_load(open("conformance.yaml"))["contract"])')"
          for profile in $profiles; do
            pnpm --dir "$CONTRACT/runner" -s conformance run --base-url http://localhost:8080 \
              --scenarios "$CONTRACT/scenarios" --profile "$profile" \
              --implementation python-oauth2-server --contract "$contract" \
              --report "$GITHUB_WORKSPACE/conformance-${profile}.json" || true
          done
      - name: Gate each report against declared deviations
        run: |
          set -euo pipefail
          profiles="$(uv run python -c 'import yaml; print(*yaml.safe_load(open("conformance.yaml"))["profiles"])')"
          for profile in $profiles; do
            uv run python scripts/check_conformance_report.py conformance.yaml "conformance-${profile}.json"
          done
      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-*.json
          if-no-files-found: ignore

  publish-image:
    name: Publish GHCR image
    needs: [gate, db-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
