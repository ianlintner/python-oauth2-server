name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --locked
      - name: Gate (ruff + pytest)
        run: bash scripts/gate.sh

  # Minimum-supported-dependency compat job. Resolves every *direct* dependency
  # to its declared floor (`--resolution lowest-direct`) so we actually exercise
  # the `>=` minimums in pyproject (e.g. fastapi>=0.115, pydantic-settings>=2.7.0)
  # rather than only the locked versions. Guards against regressions that would
  # silently declare support for a floor the source cannot import/run against.
  # `--resolution lowest-direct` must sit on `uv sync` (NOT `uv lock` followed by
  # a plain `uv sync`, which re-resolves back up to the latest versions). The
  # version assertion then fails loudly if the resolved pins drift from the
  # declared floors, proving the floors are genuinely exercised rather than only
  # the locked versions.
  min-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Sync dependencies at declared minimums
        run: uv sync --resolution lowest-direct
      - name: Assert floors are actually resolved
        # `--no-sync` so uv run reuses the floor env instead of re-resolving to
        # the locked (latest) versions on account of the resolution-mode change.
        run: |
          uv run --no-sync python - <<'PY'
          import fastapi, pydantic_settings
          assert fastapi.__version__ == "0.115.0", f"fastapi resolved to {fastapi.__version__}, floor is 0.115.0"
          assert pydantic_settings.__version__ == "2.7.0", f"pydantic-settings resolved to {pydantic_settings.__version__}, floor is 2.7.0"
          print("floors OK: fastapi", fastapi.__version__, "pydantic-settings", pydantic_settings.__version__)
          PY
      - name: Pytest at minimum versions
        run: uv run --no-sync pytest -q

  # MongoDB backend contract suite (Phase 3d) — deliberately NOT a `needs`:
  # of `gate` above (runs in parallel) and NOT folded into `scripts/gate.sh`,
  # so the default SQLite gate stays fast and never requires Docker. Docker
  # is available on ubuntu-latest GitHub-hosted runners, so the
  # `testcontainers` python package (already a dev dependency) can start its
  # own mongod — no `services:` container needed, keeping the local-dev and
  # CI code paths for the Mongo suite identical (same
  # `RUN_TESTCONTAINERS=1 uv run pytest ...` invocation either way).
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Sync dependencies (incl. mongo extra)
        run: uv sync --locked --all-extras
      - name: MongoStorage contract + e2e + compliance pin (testcontainers)
        env:
          RUN_TESTCONTAINERS: "1"
        run: >-
          uv run pytest tests/test_mongo_storage.py tests/test_mongo_admin.py
          tests/test_mongo_e2e.py tests/test_rfc_compliance.py -q

  publish-image:
    name: Publish GHCR image
    needs: [gate, db-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
