name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BLOCKING secret scanner. Runs against the full git history (fetch-depth: 0) so
  # committed-but-later-removed secrets are caught, not just the working tree.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify gitleaks
        run: |
          set -euo pipefail
          URL_BASE="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          curl -fsSL -o gitleaks_8.30.1_linux_x64.tar.gz "${URL_BASE}/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL -o gitleaks_8.30.1_checksums.txt "${URL_BASE}/gitleaks_8.30.1_checksums.txt"
          grep 'gitleaks_8.30.1_linux_x64.tar.gz' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks version

      - name: Scan git history for secrets
        run: |
          set -euo pipefail
          ./gitleaks git --redact --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif .

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # Advisory-only: non-blocking. Findings land in code scanning (SARIF); this job
  # never fails the PR. Do not treat a green run as "no vulnerabilities".
  # Known-vulnerability scan of the locked dependency set (advisories only).
  # Uses the upstream reusable workflow; reports but does not fail on findings.
  osv-scanner:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: false
      upload-sarif: true

  # Advisory: workflow hardening / supply-chain lint of these GitHub Actions.
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: true

  # Advisory: static analysis via Semgrep (default + secrets + jwt + python/fastapi).
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.185.0@sha256:f83a64e8a7d985eaa51ee3978c9c882be946964c68633fba5d2817cf297a3912
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep scan
        run: >-
          semgrep scan
          --config p/default
          --config p/secrets
          --config p/jwt
          --config p/python
          --sarif --output semgrep.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Advisory-only: non-blocking (see also `continue-on-error` on its steps).
  # Python dependency advisory scan (pip-audit) against the frozen lock.
  # A non-zero pip-audit exit is reported in the job summary but does not fail
  # the workflow. Maintainers who want a blocking gate should drop
  # `continue-on-error` and the trailing `exit 0` below.
  pip-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Export locked runtime requirements
        run: uv export --frozen --no-dev --format requirements-txt -o "$RUNNER_TEMP/req.txt"

      - name: Audit dependencies (advisory-only, non-blocking)
        continue-on-error: true
        run: |
          set +e
          uvx pip-audit --strict --disable-pip \
            -r "$RUNNER_TEMP/req.txt" --format json \
            --output "$RUNNER_TEMP/pip-audit.json"
          audit_rc=$?
          {
            echo "### pip-audit (advisory-only, non-blocking)"
            echo ""
            if [ "$audit_rc" -ne 0 ]; then
              echo "> :warning: pip-audit exited ${audit_rc} (vulnerabilities or audit error)."
              echo "> This job is advisory and does not block the PR. Review the table below."
              echo ""
            fi
            echo "| Package | Version | ID | Fix versions |"
            echo "|---|---|---|---|"
            if [ -s "$RUNNER_TEMP/pip-audit.json" ]; then
              jq -r '[.dependencies[]
                | . as $d
                | ($d.vulns // [])
                | .[] | {k: "\($d.name)|\($d.version)|\(.id)", name: $d.name,
                         version: $d.version, id: .id,
                         fixes: ((.fix_versions // []) | join(", "))}]
                | unique_by(.k)
                | .[] | "| \(.name) | \(.version) | \(.id) | \(.fixes) |"' \
                "$RUNNER_TEMP/pip-audit.json" || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # Advisory-only: non-blocking (see also `continue-on-error` on the run step).
  # Python AST-level security lint (bandit) over the source tree. Findings are
  # published to code scanning via SARIF; they do NOT fail the workflow.
  bandit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Run bandit
        continue-on-error: true
        run: uvx --from 'bandit[sarif]' bandit -r src -f sarif -o bandit.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: bandit.sarif
          category: bandit
