services:
  postgres:
    image: postgres:16
    container_name: oauth2_dev_postgres
    environment:
      POSTGRES_DB: oauth2
      POSTGRES_USER: oauth2
      POSTGRES_PASSWORD: oauth2
    ports:
      - "5455:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oauth2 -d oauth2"]
      interval: 5s
      timeout: 5s
      retries: 10
